# Publishes ConventionAssertions and ConventionAssertions.AspNetCore to NuGet when a version tag is pushed.
# It can also be run manually via "Run workflow" by picking a version tag (not a branch) in the "Use workflow from"
# selector; a run on a branch fails at the "Require a tag" step.
#
# Tag format: v<major>.<minor>.<patch>[-<prerelease>], for example v0.25.0 or v1.0.0-beta.1.
# The package version comes from the tag (without the leading "v") via MinVer; a final check makes sure
# the packed version matches the tag.
#
# Publishes with nuget.org Trusted Publishing (OIDC), so no long-lived API key is stored. Requires:
# - a Trusted Publishing policy on nuget.org for repository nwendel/ConventionAssertions and workflow file release.yml
#   (owned by an account with push rights for both packages); if the policy names an environment, it must be "nuget"
# - the secret NUGET_USER in the GitHub environment "nuget": the nuget.org profile name (not email) of that account
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for nuget.org Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

env:
  SOLUTION_FILE: src/ConventionAssertions.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget # holds the NUGET_USER secret

    steps:
      - name: Require a tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::The release workflow must be triggered by a version tag, but was triggered on ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version tag. Expected v<major>.<minor>.<patch>[-<prerelease>], e.g. v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${TAG#v}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $SOLUTION_FILE

      - name: Build
        run: dotnet build $SOLUTION_FILE --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test $SOLUTION_FILE --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack $SOLUTION_FILE --no-build --configuration Release

      - name: Check package version matches tag
        run: |
          EXPECTED="artifacts/ConventionAssertions.${{ steps.version.outputs.version }}.nupkg"
          if [[ ! -f "$EXPECTED" ]]; then
            echo "::error::Expected $EXPECTED, but MinVer produced a different version:"
            ls artifacts
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        # Pushing the .nupkg also pushes the matching .snupkg symbol package next to it.
        # The API key is a short-lived one issued by the login step above.
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
